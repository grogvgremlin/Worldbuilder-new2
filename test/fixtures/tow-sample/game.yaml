# The game: Warhammer: the Old World.
# What the game itself defines; its rules and content live in its packages (rulebook first).

game: "Warhammer: the Old World"
short name: tow

statlines:
  model: [M, WS, BS, S, T, W, I, A, Ld]
  extra:
    Armour save: {base: 7, better: lower}     # 7 = none ("-"); light armour +1 gives 6+
    Ward save: {better: lower}
  weapon: [Range, S, AP]
bounds: {all: [1, 10], applied: at output}

measures:
  - {name: Points, short: pts, rounding: up}

categories: [Characters, Core, Special, Rare, Mercenaries, Allies]
sections: [Characters, Infantry, Cavalry, Chariots, Monsters, War Machines]   # the book's profile groups (p. 3)

troop types: [Regular Infantry, Heavy Infantry, Light Cavalry, Heavy Cavalry, Monstrous Cavalry,
              Monstrous Creature, Behemoth, Light Chariot, Heavy Chariot, War Machine, Swarm, War Beasts]

roles: [General, Battle Standard Bearer]

bag order: [set, add, multiply, cap, floor]

core: [Rulebook, Races]
default composition: [Standard composition]

# Settings: what can be changed for a game or a list without code. Each has a default and the
# choices offered in a dropdown; any value can also be written by hand. A package's Settings tab,
# a pick-up game or a list can set its own value (the most specific wins).
settings:
  - name: Per 1,000 points
    about: "How many times a 'per 1,000 points' limit applies at the points target"
    default: full(target / 1000)
    choices:
      "Full thousands (2,500 → 2)": full(target / 1000)
      "Started thousands (2,100 → 3)": started(target / 1000)
      "Nearest thousand (2,500 → 3)": nearest(target / 1000)
      "In proportion, rounded down": scale(target / 1000, down)
      "In proportion, rounded to nearest": scale(target / 1000, nearest)

# Presets: ready-made starts for a new context (a game set-up in Pick-up). Each names books (with
# "armies: all", every army in those books too), FAQs, house rules, composition sets and settings.
# A package that isn't loaded yet is listed as missing and skipped.
presets:
  - name: TOW core only
    about: "The rulebook and races: build your own from there"
  - name: TOW basic
    about: Forces of Fantasy and Ravening Hordes with every army in them, Standard composition
    books: [Forces of Fantasy, Ravening Hordes]
    armies: all
    composition: [Standard composition]

# What sheet columns are called when shown; a column's own name otherwise.
headings:
  Slots: Command
  Equipment Options: Options
  Rules Options: Special rules
  Magic Items: Magic items
  Unit Limit: Limits
